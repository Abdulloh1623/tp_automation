name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Bir branch'da yangi push bo'lsa, eski (tugamagan) ishni bekor qiladi
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Tekshirish (lint + tsc + test + build)
    runs-on: ubuntu-latest

    # Build/tsc uchun placeholder qiymatlar — CI'da real baza/sirlar kerak emas
    # (auth sahifalari dynamic, Prisma client query paytida ulanadi).
    # MUHIM: NODE_ENV bu yerda "production" QILINMAYDI — aks holda `npm ci`
    # devDependencies'ni (vitest, typescript, prisma, tailwind...) o'rnatmaydi.
    # `next build` o'zi production rejimini qo'yadi.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SESSION_SECRET: ci-placeholder-secret-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js o'rnatish
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Prisma client generatsiya
        run: npx prisma generate

      - name: A11y backlog (informatsion)
        run: |
          COUNT=$(npx eslint . -f json 2>/dev/null             | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);let n=0;for(const f of j)for(const m of f.messages)if((m.ruleId||'').startsWith('jsx-a11y'))n++;console.log(n)})")
          echo "A11y ogohlantirishlari: ${COUNT}"
          echo "### ♿ A11y backlog: **${COUNT}** ta" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint (ESLint)
        run: npm run lint

      - name: TypeScript tekshiruvi
        run: npx tsc --noEmit

      - name: Unit testlar
        run: npm test

      - name: Xavfsizlik auditi (informatsion)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Production build
        run: npm run build

  integration:
    name: Integratsion (server action'lar + baza)
    runs-on: ubuntu-latest

    # Bu testlar HAQIQIY bazaga qarshi ishlaydi — server action'larning pul va
    # ombor mantiqi (chek majburiyligi, qoldiq balansi, rollback) faqat shu
    # yerda tekshiriladi.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_automation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Baza nomida "test" bo'lishi SHART — integration-setup.ts shuni
      # tekshiradi va noto'g'ri bazani tozalab yuborishga yo'l qo'ymaydi.
      DATABASE_URL: postgresql://tp:tp@localhost:5432/tp_automation_test?schema=public
      SESSION_SECRET: ci-integration-secret-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js o'rnatish
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Prisma client generatsiya
        run: npx prisma generate

      - name: Migratsiyalarni qo'llash
        run: npx prisma migrate deploy

      - name: Integratsion testlar
        run: npm run test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_automation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://tp:tp@localhost:5432/tp_automation?schema=public
      SESSION_SECRET: ci-e2e-secret-not-used-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js o'rnatish
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bog'liqliklarni o'rnatish
        run: npm ci

      - name: Prisma client generatsiya
        run: npx prisma generate

      - name: Migratsiyalarni qo'llash
        run: npx prisma migrate deploy

      - name: Test ma'lumotlarini seed qilish
        run: npm run db:seed

      - name: Playwright brauzerini o'rnatish
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: E2E testlar
        run: npm run test:e2e

      - name: Playwright hisobotini saqlash (xato bo'lsa)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # UI ko'rikdan o'tkazish uchun: asosiy ekranlar (desktop + mobil).
      # PR sahifasidagi "Artifacts" bo'limidan yuklab olib solishtiriladi.
      - name: Skrinshotlarni saqlash
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: skrinshotlar
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn

  docker-image:
    name: Docker image (qurish + hajm)
    runs-on: ubuntu-latest
    # Deploy image'ni FAQAT main'ga merge'dan keyin quradi (deploy.yml), ya'ni
    # buzuq Dockerfile PR'da ko'rinmay qolardi va merge'dan keyin deployni
    # jimgina to'xtatib qo'yardi (serverdagi cron eski image bilan ishlayverardi).
    # Bu job aynan shuni oldini oladi va image hajmini ham chop etadi.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image qurish (push YO'Q)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tp-automation:ci
          # deploy.yml bilan bir xil GHA keshi — qayta qurish tez bo'ladi
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Hajmni ko'rsatish
        run: |
          SIZE=$(docker image inspect tp-automation:ci --format '{{.Size}}')
          MB=$((SIZE / 1024 / 1024))
          echo "Image hajmi: ${MB} MB"
          echo "### 🐳 Docker image hajmi: **${MB} MB**" >> "$GITHUB_STEP_SUMMARY"
          # Har deploy shu hajmni serverga tushiradi (oxirgi 2 tasi saqlanadi).
          # 1200MB dan oshsa — nimadir keraksiz narsa image'ga tushgan.
          if [ "$MB" -gt 1200 ]; then
            echo "::warning::Image hajmi ${MB} MB — kutilganidan katta (>1200MB)"
          fi
